[workspace]
resolver = "2"
members = ["crates/todo-core", "crates/todo-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/storyteller-ai/todo"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = "0.25"
dirs = "7"
thiserror = "2"
notify = "8"

# Blazingly fast: fat LTO, single codegen unit, no unwinding, stripped.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
